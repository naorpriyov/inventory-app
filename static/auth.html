<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כניסה | ניהול מלאי</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#146C66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ניהול מלאי">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--surface:#FFFFFF;--ink:#10292E;--muted:#4A6066;--line:#D0DBD8;--accent:#146C66;--accent-ink:#fff;--bad:#8A1212;--focus:#0B5CD5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D191B;--surface:#14252A;--ink:#E5EFEE;--muted:#A5B9B7;--line:#2A4045;--accent:#4DB8AD;--accent-ink:#04211F;--bad:#FFB8B8;--focus:#7FB2FF;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;line-height:1.55;display:grid;place-items:center;padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:420px}
.mark{width:3.2rem;height:3.2rem;border-radius:.8rem;background:var(--accent);display:grid;place-items:center;font-size:1.6rem;margin-bottom:1rem}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3rem}
.sub{color:var(--muted);margin:0 0 1.5rem}
form{display:grid;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1.4rem}
label{font-weight:600;display:block;margin-bottom:.3rem}
input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:.6rem;padding:.65rem .75rem;min-height:48px}
input:focus{border-color:var(--accent);outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hint{font-size:.85rem;color:var(--muted);margin-top:.25rem}
button{font:inherit;font-weight:700;min-height:52px;border:0;border-radius:.65rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:1.05rem}
button:disabled{opacity:.6}
.err{color:var(--bad);font-weight:600;min-height:1.2em;margin:0}
.alt{text-align:center;margin-top:1.1rem}
.alt a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">📦</div>
  <h1 id="title">כניסה</h1>
  <p class="sub" id="sub"></p>
  <form id="f" novalidate>
    <div id="fInvite"><label for="invite">קוד הרשמה</label><input id="invite" autocomplete="off" dir="ltr" autocapitalize="characters"><div class="hint">את הקוד מקבלים ממנהל המערכת.</div></div>
    <div id="fName"><label for="name">שם מלא</label><input id="name" autocomplete="name"></div>
    <div><label for="username">שם משתמש</label><input id="username" autocomplete="username" dir="ltr" autocapitalize="none" spellcheck="false"><div class="hint" id="userHint">באנגלית, ספרות, נקודה או מקף.</div></div>
    <div><label for="password">סיסמה</label><input id="password" type="password" dir="ltr"><div class="hint" id="pwHint">לפחות 8 תווים.</div></div>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="go">כניסה</button>
  </form>
  <p class="alt" id="alt"></p>
</main>
<script>
(function(){
  const mode=location.pathname.replace('/','')||'login';
  const $=id=>document.getElementById(id);
  const T={
    login:{title:'כניסה',sub:'ניהול מלאי וספר סמים',btn:'כניסה',alt:'עובד חדש? <a href="/register">הרשמה</a>',fields:[]},
    register:{title:'הרשמה',sub:'אחרי ההרשמה תוכלו להחתים, ולבקש מהמנהל הרשאות נוספות.',btn:'הרשמה',alt:'כבר רשומים? <a href="/login">כניסה</a>',fields:['fInvite','fName']},
    setup:{title:'הגדרה ראשונה',sub:'יצירת חשבון מנהל המערכת. החשבון הזה יוכל לנהל את כל המשתמשים וההרשאות.',btn:'יצירת חשבון מנהל',alt:'',fields:['fName']}
  }[mode]||null;
  const t=T||{title:'כניסה',btn:'כניסה',fields:[]};
  $('title').textContent=t.title; $('sub').textContent=t.sub||''; $('go').textContent=t.btn; $('alt').innerHTML=t.alt||'';
  ['fInvite','fName'].forEach(id=>{ $(id).hidden=!t.fields.includes(id); });
  if(mode==='login'){ $('userHint').hidden=true; $('pwHint').hidden=true; $('password').autocomplete='current-password'; } else $('password').autocomplete='new-password';
  document.title=t.title+' | ניהול מלאי';
  $('f').addEventListener('submit',async e=>{
    e.preventDefault(); $('err').textContent=''; $('go').disabled=true;
    const body={username:$('username').value.trim(),password:$('password').value,name:$('name').value.trim(),invite:$('invite').value.trim()};
    try{
      const r=await fetch('/api/'+(mode==='register'?'register':mode==='setup'?'setup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){ $('err').textContent=j.error||'הפעולה נכשלה.'; return; }
      location.href='/';
    }catch(er){ $('err').textContent='אין חיבור לשרת.'; }
    finally{ $('go').disabled=false; }
  });
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
</body>
</html>
